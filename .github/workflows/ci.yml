name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: compile + tests (CPU, no GUI)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies (CPU-only torch; no PyQt/DeepFilterNet — those
              backends skip cleanly in the tests)
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" scipy soundfile onnxruntime
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile check
        run: python -m compileall -q voiceiso app scripts tests

      - name: Unit tests — deferred tail + metric alignment (deterministic fake DFN3 backend)
        run: python -m tests.test_deferred_tail

      - name: Unit tests — speech protection (fake backend)
        run: python -m tests.test_speech_guard

      - name: Classifier / config wiring
        run: python -m tests.test_phase_a

      - name: Pipeline robustness (heavy backends skip cleanly)
        run: python -m tests.test_robustness
