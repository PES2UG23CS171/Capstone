name: Package

# Builds the Windows installer and the Mac disk image on real machines of each
# platform (PyInstaller cannot cross-compile).  Every build self-tests the
# packaged app: real models, real noise removal, real window.
#
# Runs on demand, when packaging changes, and for version tags.  Pushing a tag
# like v1.0.0 also publishes both files as a public GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "packaging/**"
      - ".github/workflows/package.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Run tests on Windows
        # PowerShell only reports the last command's exit code, so check each one.
        run: |
          foreach ($t in "devices", "deferred_tail", "speech_guard", "phase_a", "robustness") {
            python -m "tests.test_$t"
            if ($LASTEXITCODE -ne 0) { throw "tests.test_$t failed" }
          }
      - name: Build, self-test, install, self-test again
        run: packaging\build_windows.ps1
      - name: Keep the self-test reports and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-reports
          path: build/selftest-*    # build_windows.ps1 copies the app's log here
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceISO-Windows
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0

  macos:
    name: Mac disk image
    runs-on: macos-latest      # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt
      - name: Run tests on macOS
        run: |
          python -m tests.test_devices
          python -m tests.test_deferred_tail
          python -m tests.test_speech_guard
          python -m tests.test_phase_a
          python -m tests.test_robustness
      - name: Build, self-test, make the disk image
        run: packaging/build_macos.sh
      - name: Keep the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-reports
          path: build/selftest-*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceISO-macOS
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: VoiceISO-*
          merge-multiple: true
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "VoiceISO $GITHUB_REF_NAME" \
            --notes-file packaging/READ_ME_FIRST.txt
